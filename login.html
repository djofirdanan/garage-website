<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כניסה / הרשמה - GARAGE</title>
  <meta name="robots" content="noindex, follow" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preload" href="fonts/GoogleSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ─── Auth Page Layout ─── */
    .auth-page {
      min-height: 100vh;
      max-width: none;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f0;
      padding: 20px;
    }

    .auth-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 960px;
      height: clamp(580px, 80vh, 720px);
      border: 3px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }

    /* ─── Image Slider Panel ─── */
    .auth-slider {
      position: relative;
      overflow: hidden;
      background: var(--black);
    }

    .auth-slider__track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .auth-slider__slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      flex-shrink: 0;
    }

    .auth-slider__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .auth-slider__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(18,18,18,.85) 0%,
        rgba(18,18,18,.2) 50%,
        rgba(18,18,18,.1) 100%
      );
    }

    .auth-slider__caption {
      position: absolute;
      bottom: 32px;
      right: 28px;
      left: 28px;
      color: #fff;
    }

    .auth-slider__caption-tag {
      display: inline-block;
      background: var(--mint);
      color: var(--black);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 100px;
      margin-bottom: 10px;
    }

    .auth-slider__caption h2 {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
      margin: 0 0 6px;
    }

    .auth-slider__caption p {
      font-size: 13px;
      font-weight: 400;
      opacity: .85;
      margin: 0;
    }

    .auth-slider__dots {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }

    .auth-slider__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background .25s, transform .25s;
    }

    .auth-slider__dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* ─── Form Panel ─── */
    .auth-form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 40px;
      background: #fff;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .auth-logo img {
      height: 36px;
      object-fit: contain;
    }

    .auth-logo strong {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .06em;
    }

    /* ─── Tabs ─── */
    .auth-tabs {
      display: flex;
      border: 2.5px solid var(--black);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 28px;
      background: #f4f4f0;
    }

    .auth-tab {
      flex: 1;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #888;
      transition: background .2s, color .2s;
      font-family: 'Noto Sans Hebrew', sans-serif;
    }

    .auth-tab.active {
      background: var(--black);
      color: #fff;
      border-radius: 100px;
    }

    /* ─── Form Fields ─── */
    .auth-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .auth-field label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: .03em;
    }

    .auth-field input {
      width: 100%;
      padding: 11px 14px;
      border: 2.5px solid #d0d0d0;
      border-radius: 6px;
      font-size: 16px;
      font-family: 'Noto Sans Hebrew', sans-serif;
      color: var(--black);
      background: #fff;
      outline: none;
      transition: border-color .2s;
      box-sizing: border-box;
    }

    .auth-field input:focus {
      border-color: var(--black);
    }

    .auth-field-pw {
      position: relative;
    }

    .auth-field-pw input {
      padding-left: 42px;
    }

    .auth-pw-toggle {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      padding: 2px;
      display: flex;
      align-items: center;
    }

    .auth-pw-toggle:hover { color: var(--black); }

    .auth-optional {
      font-size: 11px;
      font-weight: 400;
      color: #aaa;
      margin-right: 4px;
    }

    /* ─── Error / Success ─── */
    .auth-msg {
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .auth-msg.error {
      background: #fff0f0;
      border: 1.5px solid #ffb3b3;
      color: #c0392b;
    }

    .auth-msg.success {
      background: #f0fff8;
      border: 1.5px solid var(--mint);
      color: #1a7a55;
    }

    /* ─── Submit Button ─── */
    .auth-submit {
      width: 100%;
      padding: 13px;
      background: var(--black);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      border: 2.5px solid var(--black);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Noto Sans Hebrew', sans-serif;
      transition: background .18s, color .18s, transform .12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .auth-submit:hover:not(:disabled) {
      background: #2a2a2a;
    }

    .auth-submit:active:not(:disabled) {
      transform: scale(.98);
    }

    .auth-submit:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .auth-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-switch {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }

    .auth-switch a, .auth-switch button {
      background: none;
      border: none;
      color: var(--black);
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Noto Sans Hebrew', sans-serif;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ─── Panel visibility ─── */
    .auth-panel { display: none; }
    .auth-panel.active { display: flex; flex-direction: column; gap: 16px; }

    /* ─── Mobile ─── */
    @media (max-width: 680px) {
      .auth-page { padding: 0; align-items: stretch; }

      .auth-wrap {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100dvh;
        border: none;
        box-shadow: none;
        border-radius: 0;
      }

      .auth-slider { display: none; }

      .auth-form-panel {
        padding: 0;
        justify-content: flex-start;
      }

      .auth-form-panel::before {
        content: '';
        display: block;
        height: 220px;
        background:
          linear-gradient(to top, rgba(18,18,18,.75) 0%, rgba(18,18,18,.1) 70%),
          url('https://images.pexels.com/photos/6915261/pexels-photo-6915261.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=440&w=800') center/cover no-repeat;
        flex-shrink: 0;
      }

      .auth-form-inner {
        flex: 1;
        padding: 28px 24px 48px;
        overflow-y: auto;
      }

      .auth-logo { display: none; }
    }

    @media (min-width: 681px) {
      .auth-form-inner { width: 100%; }
    }
  </style>
</head>
<body>

<main class="auth-page">
  <div class="auth-wrap">

    <!-- RIGHT (RTL col-1): Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-inner">

        <!-- Logo -->
        <div class="auth-logo">
          <img src="https://garage.org.il/wp-content/uploads/2020/12/%D7%9C%D7%95%D7%92%D7%95-%D7%92%D7%A8%D7%90%D7%92-%D7%97%D7%93%D7%A9.png"
               alt="GARAGE"
               onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
          <strong style="display:none">GARAGE</strong>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">כניסה</button>
          <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">הרשמה</button>
        </div>

        <!-- Login Panel -->
        <div class="auth-panel active" id="panelLogin">
          <div class="auth-msg" id="loginMsg"></div>

          <div class="auth-fields">
            <div class="auth-field">
              <label for="loginPhone">טלפון</label>
              <input id="loginPhone" type="tel" autocomplete="tel" placeholder="050-1234567" />
            </div>
            <div class="auth-field">
              <label for="loginPassword">סיסמה</label>
              <div class="auth-field-pw">
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
                <button type="button" class="auth-pw-toggle" onclick="togglePw('loginPassword', this)" aria-label="הצג סיסמה">
                  <i class="ph ph-eye" style="font-size:18px"></i>
                </button>
              </div>
            </div>
          </div>

          <button class="auth-submit" id="loginBtn" onclick="doLogin()">
            <span class="auth-spinner" id="loginSpinner"></span>
            <span id="loginBtnText">התחבר</span>
          </button>

          <p class="auth-switch">אין לך חשבון?
            <button onclick="switchTab('register')">הירשם בחינם</button>
          </p>
        </div>

        <!-- Register Panel -->
        <div class="auth-panel" id="panelRegister">
          <div class="auth-msg" id="registerMsg"></div>

          <div class="auth-fields">
            <div class="auth-field">
              <label for="regName">שם מלא</label>
              <input id="regName" type="text" autocomplete="name" placeholder="ישראל ישראלי" />
            </div>
            <div class="auth-field">
              <label for="regPhone">טלפון</label>
              <input id="regPhone" type="tel" autocomplete="tel" placeholder="050-1234567" />
            </div>
            <div class="auth-field">
              <label for="regEmail">
                אימייל
                <span class="auth-optional">(לא חובה)</span>
              </label>
              <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="auth-field">
              <label for="regPassword">סיסמה</label>
              <div class="auth-field-pw">
                <input id="regPassword" type="password" autocomplete="new-password" placeholder="לפחות 6 תווים" />
                <button type="button" class="auth-pw-toggle" onclick="togglePw('regPassword', this)" aria-label="הצג סיסמה">
                  <i class="ph ph-eye" style="font-size:18px"></i>
                </button>
              </div>
            </div>
          </div>

          <button class="auth-submit" id="registerBtn" onclick="doRegister()">
            <span class="auth-spinner" id="registerSpinner"></span>
            <span id="registerBtnText">צור חשבון</span>
          </button>

          <p class="auth-switch">כבר יש לך חשבון?
            <button onclick="switchTab('login')">התחבר</button>
          </p>
        </div>

      </div><!-- /auth-form-inner -->
    </div><!-- /auth-form-panel -->

    <!-- LEFT (RTL col-2): Image Slider -->
    <div class="auth-slider" id="authSlider">
      <div class="auth-slider__track" id="sliderTrack">

        <div class="auth-slider__slide">
          <img src="https://images.pexels.com/photos/6915261/pexels-photo-6915261.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800"
               alt="מפיץ ריח עם אור ורוד" loading="eager" />
          <div class="auth-slider__overlay"></div>
          <div class="auth-slider__caption">
            <span class="auth-slider__caption-tag">מנוי חדש</span>
            <h2>הבית שלך מגיע לריח הכי טוב</h2>
            <p>גלה את קולקציית הניחוחות הפרמיום שלנו</p>
          </div>
        </div>

        <div class="auth-slider__slide">
          <img src="https://images.pexels.com/photos/6915313/pexels-photo-6915313.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800"
               alt="מפיץ ריח עץ עם אדים" loading="lazy" />
          <div class="auth-slider__overlay"></div>
          <div class="auth-slider__caption">
            <span class="auth-slider__caption-tag">פרמיום</span>
            <h2>ריח שמדבר בעד עצמו</h2>
            <p>חומרי גלם מהמובחרים בעולם</p>
          </div>
        </div>

        <div class="auth-slider__slide">
          <img src="https://images.pexels.com/photos/6915107/pexels-photo-6915107.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800"
               alt="מפיץ ריח אטמוספרי" loading="lazy" />
          <div class="auth-slider__overlay"></div>
          <div class="auth-slider__caption">
            <span class="auth-slider__caption-tag">לבית</span>
            <h2>אווירה שמתחילה מהריח</h2>
            <p>18 ניחוחות יוקרתיים לכל סגנון</p>
          </div>
        </div>

        <div class="auth-slider__slide">
          <img src="https://images.pexels.com/photos/6914778/pexels-photo-6914778.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800"
               alt="מפיץ ריח עץ אלגנטי" loading="lazy" />
          <div class="auth-slider__overlay"></div>
          <div class="auth-slider__caption">
            <span class="auth-slider__caption-tag">GARAGE</span>
            <h2>הזמנות מהירות. מעקב קל</h2>
            <p>הצטרף לאלפי לקוחות מרוצים</p>
          </div>
        </div>

      </div>
      <div class="auth-slider__dots" id="sliderDots"></div>
    </div>

  </div><!-- /auth-wrap -->
</main>

<script src="customer-auth.js"></script>
<script>
(function () {
  /* ── Redirect if already logged in ── */
  if (typeof GarageAuth !== 'undefined' && GarageAuth.getToken()) {
    const ret = new URLSearchParams(location.search).get('return') || 'account.html';
    location.href = ret;
    return;
  }

  const RET = new URLSearchParams(location.search).get('return') || 'account.html';

  /* ── Tab switcher ── */
  window.switchTab = function (tab) {
    document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
    document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    clearMsg('loginMsg');
    clearMsg('registerMsg');
  };

  /* ── Password toggle ── */
  window.togglePw = function (inputId, btn) {
    const inp = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'ph ph-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'ph ph-eye';
    }
  };

  /* ── Helpers ── */
  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'auth-msg ' + type;
    el.style.display = 'block';
  }

  function clearMsg(id) {
    const el = document.getElementById(id);
    el.style.display = 'none';
    el.textContent = '';
  }

  function setLoading(btnId, spinnerId, textId, loading, label) {
    const btn = document.getElementById(btnId);
    const spinner = document.getElementById(spinnerId);
    const txt = document.getElementById(textId);
    btn.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    txt.textContent = label;
  }

  /* ── Login ── */
  window.doLogin = async function () {
    clearMsg('loginMsg');
    const phone = document.getElementById('loginPhone').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!phone || !password) { showMsg('loginMsg', 'נא למלא טלפון וסיסמה', 'error'); return; }
    setLoading('loginBtn', 'loginSpinner', 'loginBtnText', true, 'מתחבר...');
    try {
      const res = await GarageAuth.apiFetch('/api/storefront/auth/login', {
        method: 'POST',
        body: JSON.stringify({ phone, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'שגיאה בהתחברות');
      GarageAuth.setToken(data.token);
      GarageAuth.setCustomer(data.customer);
      showMsg('loginMsg', 'התחברת בהצלחה! מעביר...', 'success');
      setTimeout(() => { location.href = RET; }, 600);
    } catch (err) {
      showMsg('loginMsg', err.message, 'error');
      setLoading('loginBtn', 'loginSpinner', 'loginBtnText', false, 'התחבר');
    }
  };

  /* ── Register ── */
  window.doRegister = async function () {
    clearMsg('registerMsg');
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    if (!name || !phone || !password) { showMsg('registerMsg', 'נא למלא שם, טלפון וסיסמה', 'error'); return; }
    if (password.length < 6) { showMsg('registerMsg', 'הסיסמה חייבת להכיל לפחות 6 תווים', 'error'); return; }
    setLoading('registerBtn', 'registerSpinner', 'registerBtnText', true, 'יוצר חשבון...');
    try {
      const body = { name, phone, password };
      if (email) body.email = email;
      const res = await GarageAuth.apiFetch('/api/storefront/auth/signup', {
        method: 'POST',
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'שגיאה בהרשמה');
      GarageAuth.setToken(data.token);
      GarageAuth.setCustomer(data.customer);
      showMsg('registerMsg', 'ברוך הבא! מעביר...', 'success');
      setTimeout(() => { location.href = RET; }, 600);
    } catch (err) {
      showMsg('registerMsg', err.message, 'error');
      setLoading('registerBtn', 'registerSpinner', 'registerBtnText', false, 'צור חשבון');
    }
  };

  /* ── Enter key submits ── */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    const loginActive = document.getElementById('panelLogin').classList.contains('active');
    if (loginActive) doLogin();
    else doRegister();
  });

  /* ── Image Slider ── */
  const track = document.getElementById('sliderTrack');
  const dotsContainer = document.getElementById('sliderDots');
  const slides = track ? track.querySelectorAll('.auth-slider__slide') : [];
  let currentSlide = 0;
  let sliderTimer = null;

  if (slides.length > 0) {
    /* build dots */
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'auth-slider__dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'שקופית ' + (i + 1));
      dot.addEventListener('click', () => goToSlide(i));
      dotsContainer.appendChild(dot);
    });

    function goToSlide(n) {
      currentSlide = (n + slides.length) % slides.length;
      track.style.transform = 'translateX(' + (currentSlide * 100) + '%)';
      dotsContainer.querySelectorAll('.auth-slider__dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentSlide);
      });
    }

    function nextSlide() { goToSlide(currentSlide + 1); }

    function startTimer() {
      sliderTimer = setInterval(nextSlide, 4500);
    }

    function stopTimer() {
      if (sliderTimer) clearInterval(sliderTimer);
    }

    /* pause on hover */
    const slider = document.getElementById('authSlider');
    slider.addEventListener('mouseenter', stopTimer);
    slider.addEventListener('mouseleave', startTimer);

    startTimer();
  }

})();
</script>
</body>
</html>
