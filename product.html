<script src="site-components.js"></script>
<script src="scents-data.js"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script>
const params   = new URLSearchParams(location.search);
const prodId   = params.get('id') || 'car';
const product  = PRODUCTS[prodId];

/* State */
let selectedScent   = '';
let selectedQtyIdx  = 0;
let upsellsAdded    = new Set();

/* Universal scent picker state */
const bundleScentCounts = {}; // { 'ניחוח': count }
let pickerMax   = 1;
let pickerMulti = false;  // true = multi-select (bundle/qty>1), false = single-select
const PICKER_STORAGE_KEY = () => `garage_picker_${prodId}`;

/* Upsell compact chip state */
const upsellScentMap = {}; // uid -> { scentName: count }

/* ---- Picker core ---- */
function bspGetTotal() {
  return Object.values(bundleScentCounts).reduce((s, n) => s + n, 0);
}

function bspGetScentString() {
  return Object.entries(bundleScentCounts)
    .filter(([,c]) => c > 0)
    .map(([name, count]) => count > 1 ? `${name} ×${count}` : name)
    .join(', ');
}

function bspFlashError(name) {
  const pill = document.querySelector(`.bsp-pill[data-scent="${name.replace(/"/g,'\\"')}"]`);
  if (pill) {
    pill.classList.add('bsp-pill--error');
    setTimeout(() => pill.classList.remove('bsp-pill--error'), 700);
  }
  const grid = document.getElementById('bspGrid');
  if (grid) {
    grid.classList.add('bsp-grid--error');
    setTimeout(() => grid.classList.remove('bsp-grid--error'), 700);
  }
  cartToast(`הגעת ל-${pickerMax} ניחוחות — זהו המקסימום לחבילה זו`);
}

function bspSaveState() {
  try { localStorage.setItem(PICKER_STORAGE_KEY(), JSON.stringify(bundleScentCounts)); } catch(e) {}
}

function bspLoadState() {
  try {
    const raw = localStorage.getItem(PICKER_STORAGE_KEY());
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Only restore if scents still exist
    Object.entries(saved).forEach(([name, count]) => {
      if (SCENTS.find(s => s.name === name)) bundleScentCounts[name] = count;
    });
  } catch(e) {}
}

function bspClearState() {
  try { localStorage.removeItem(PICKER_STORAGE_KEY()); } catch(e) {}
}

function bspUpdate() {
  const total     = bspGetTotal();
  const freeTotal = bspGetFreeTotal(); // non-premium only — used for limit checks
  const pct       = Math.min(freeTotal / pickerMax * 100, 100);

  bspSaveState(); // persist every change

  if (pickerMulti) {
    document.getElementById('bspCount').textContent = freeTotal;
    document.getElementById('bspProgressFill').style.width = pct + '%';
    const badge = document.getElementById('bspCounterBadge');
    badge.classList.toggle('bsp-counter-badge--done', freeTotal >= pickerMax);
  }

  // Update each pill
  document.querySelectorAll('#bspGrid .bsp-pill').forEach(pill => {
    const name    = pill.dataset.scent;
    const count   = bundleScentCounts[name] || 0;
    const ctrl    = pill.querySelector('.bsp-pill-ctrl');
    const countEl = pill.querySelector('.bsp-pill-count');
    const addEl   = pill.querySelector('.bsp-pill-add');

    pill.classList.toggle('bsp-pill--active', count > 0);
    if (ctrl)   { ctrl.style.display = count > 0 ? 'flex' : 'none'; if (countEl) countEl.textContent = count; }
    if (addEl)  { addEl.style.display = count > 0 ? 'none' : ''; }

    const plusBtn = pill.querySelector('.bsp-plus');
    // Premium scents are never disabled — they bypass the free-slot limit
    if (plusBtn) plusBtn.disabled = freeTotal >= pickerMax && count === 0 && !bspIsPremium(name);
  });

  // Summary
  const summary = document.getElementById('bspSummary');
  const chips   = document.getElementById('bspSummaryChips');
  const entries = Object.entries(bundleScentCounts).filter(([,c]) => c > 0);
  if (entries.length > 0) {
    summary.style.display = 'block';
    if (pickerMulti) {
      chips.innerHTML = entries.map(([name, count]) =>
        `<span class="bsp-chip">${name}${count > 1 ? ` ×${count}` : ''}</span>`
      ).join('');
    } else {
      const scent = SCENTS.find(s => s.name === entries[0][0]);
      chips.innerHTML = scent
        ? `<span class="bsp-chip">${scent.name}</span><span style="font-size:12px;color:var(--mid);margin-right:6px">${scent.desc}</span>`
        : `<span class="bsp-chip">${entries[0][0]}</span>`;
    }
  } else {
    summary.style.display = 'none';
  }

  // Surcharge indicator — show prominently if any premium scent selected
  const surcharge = bspGetSurcharge();
  const surchargeNote  = document.getElementById('bspSurchargeNote');
  const priceNote      = document.getElementById('priceSurchargeNote');
  if (surcharge > 0) {
    const label = `תוספת ריח פרימיום: +₪${surcharge}`;
    if (surchargeNote) {
      document.getElementById('bspSurchargeText').textContent = label;
      surchargeNote.style.display = 'flex';
    }
    if (priceNote) {
      document.getElementById('priceSurchargeText').textContent = label;
      priceNote.style.display = 'flex';
    }
  } else {
    if (surchargeNote) surchargeNote.style.display = 'none';
    if (priceNote)     priceNote.style.display     = 'none';
  }
}

function bspInc(name, e) {
  e && e.stopPropagation();
  // Premium scents bypass the free-slot limit
  if (!bspIsPremium(name) && bspGetFreeTotal() >= pickerMax) { bspFlashError(name); return; }
  bundleScentCounts[name] = (bundleScentCounts[name] || 0) + 1;
  bspUpdate();
}

function bspDec(name, e) {
  e && e.stopPropagation();
  if (!bundleScentCounts[name]) return;
  bundleScentCounts[name]--;
  if (bundleScentCounts[name] === 0) delete bundleScentCounts[name];
  bspUpdate();
}

function bspPillClick(name) {
  if (bundleScentCounts[name]) {
    if (!pickerMulti) { delete bundleScentCounts[name]; bspUpdate(); }
    return;
  }
  const freeTotal = bspGetFreeTotal();
  // Premium scents bypass the free-slot limit entirely
  if (!bspIsPremium(name) && freeTotal >= pickerMax) {
    if (!pickerMulti) {
      // Single mode: replace
      Object.keys(bundleScentCounts).forEach(k => delete bundleScentCounts[k]);
      bundleScentCounts[name] = 1;
      bspUpdate();
    } else {
      bspFlashError(name);
    }
    return;
  }
  bundleScentCounts[name] = 1;
  bspUpdate();
}

function bspGetSurcharge() {
  return Object.entries(bundleScentCounts)
    .filter(([,c]) => c > 0)
    .reduce((total, [name, count]) => {
      const sc = SCENTS.find(s => s.name === name);
      return total + (sc?.price || 0) * count;
    }, 0);
}

/* Premium = scent with extra price; not counted toward the free-slot limit */
function bspIsPremium(name) {
  const sc = SCENTS.find(s => s.name === name);
  return !!(sc && sc.price > 0);
}

/* Count only non-premium selections for limit enforcement */
function bspGetFreeTotal() {
  return Object.entries(bundleScentCounts)
    .filter(([name, c]) => c > 0 && !bspIsPremium(name))
    .reduce((s, [, c]) => s + c, 0);
}

function initScentPicker(max, isMulti) {
  pickerMax   = max;
  pickerMulti = isMulti;

  // Label text
  document.getElementById('bspLabelText').textContent = isMulti
    ? 'תחילה, בואו נבחר ריחות:'
    : 'בחר ניחוח:';
  document.getElementById('bspSummaryTitle').textContent = isMulti ? 'הניחוחות שבחרת:' : 'הניחוח שבחרת:';

  // Show/hide multi-only elements
  document.getElementById('bspCounterBadge').style.display  = isMulti ? '' : 'none';
  document.getElementById('bspProgressTrack').style.display = isMulti ? '' : 'none';
  if (isMulti) document.getElementById('bspMaxDisplay').textContent = max;

  // Build grid
  const SVG_MINUS = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>`;
  const SVG_PLUS  = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>`;

  document.getElementById('bspGrid').innerHTML = SCENTS.map(s => `
    <div class="bsp-pill" data-scent="${s.name}" onclick="bspPillClick(this.dataset.scent)">
      <div class="bsp-pill-main">
        <span class="bsp-pill-name">${s.name}${s.price ? `<span class="bsp-pill-price">+₪${s.price}</span>` : ''}</span>
        <span class="bsp-pill-desc">${s.desc}</span>
      </div>
      ${isMulti ? `<div class="bsp-pill-ctrl" style="display:none">
        <button class="bsp-dec" onclick="bspDec(this.closest('.bsp-pill').dataset.scent,event)" aria-label="הפחת">${SVG_MINUS}</button>
        <span class="bsp-pill-count">0</span>
        <button class="bsp-plus" onclick="bspInc(this.closest('.bsp-pill').dataset.scent,event)" aria-label="הוסף">${SVG_PLUS}</button>
      </div>` : ''}
      <div class="bsp-pill-add">${SVG_PLUS}</div>
    </div>`).join('');

  // Restore previous selection from localStorage
  bspLoadState();
  bspUpdate();
}

function init() {
  if (!product) {
    document.querySelector('.product-page').innerHTML = '<div class="container" style="padding:80px 0;text-align:center"><h2>מוצר לא נמצא</h2><a href="index.html" class="btn-add" style="margin-top:20px;padding:13px 28px;display:inline-flex;border-radius:99px">חזרה לדף הבית</a></div>';
    return;
  }

  document.title = `${product.name} — GARAGE | שמן טהור 100%`;
  sessionStorage.setItem('garage_last_product', location.href);

  /* SEO meta */
  const pageUrl = `https://garage-beryl-sigma.vercel.app/product.html?id=${prodId}`;
  const seoDesc = `${product.name} — מפיץ ריח מתקדם עם שמן ריח טהור 100%. ${product.tagline || 'ריח נמשך שעות, 18 ניחוחות יוקרתיים, משלוח חינם מ-₪250.'}`;
  document.getElementById('page-title').textContent = document.title;
  document.getElementById('page-desc').setAttribute('content', seoDesc);
  document.getElementById('canonical-link').setAttribute('href', pageUrl);
  document.getElementById('og-url').setAttribute('content', pageUrl);
  document.getElementById('og-title').setAttribute('content', document.title);
  document.getElementById('og-desc').setAttribute('content', seoDesc);
  document.getElementById('tw-title').setAttribute('content', document.title);
  document.getElementById('tw-desc').setAttribute('content', seoDesc);
  const productImages = product.thumbs
    ? product.thumbs.map(t => `https://garage-beryl-sigma.vercel.app/${t}`)
    : (product.img ? [`https://garage-beryl-sigma.vercel.app/${product.img}`] : []);
  if (productImages[0]) {
    document.getElementById('og-img').setAttribute('content', productImages[0]);
    document.getElementById('tw-img').setAttribute('content', productImages[0]);
  }

  /* JSON-LD Product schema */
  const priceVal = product.variants ? product.variants[0].price : (product.price || '');
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify({
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": product.name,
    "description": seoDesc,
    "image": productImages,
    "brand": { "@type": "Brand", "name": "GARAGE" },
    "url": pageUrl,
    "offers": {
      "@type": "Offer",
      "priceCurrency": "ILS",
      "price": String(priceVal).replace(/[^\d.]/g, ''),
      "availability": "https://schema.org/InStock",
      "seller": { "@type": "Organization", "name": "GARAGE" }
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "reviewCount": "1000"
    }
  });
  document.head.appendChild(ldScript);

  /* breadcrumb */
  document.getElementById('breadcrumbCat').textContent  = product.categoryLabel;
  document.getElementById('breadcrumbName').textContent = product.name;

  /* mark active nav */
  document.querySelectorAll('.site-nav__links a').forEach(a => {
    if (a.href.includes(`id=${prodId}`)) a.classList.add('active');
  });

  /* gallery */
  renderGallery();

  /* info */
  document.getElementById('prodCat').textContent  = product.categoryLabel;
  document.getElementById('prodName').textContent = product.name;
  document.getElementById('prodSub').textContent  = product.subtitle;
  document.getElementById('prodDesc').textContent = product.desc;

  /* price */
  renderPrice();

  /* qty variants */
  if (product.priceVariants) {
    document.getElementById('qtyVariants').style.display = 'block';
    renderQtyVariants();
  }

  /* scent picker (universal) */
  if (product.hasScent) {
    document.getElementById('scentPicker').style.display = 'block';
    const isMulti   = !!(product.bundleBottleCount || (product.priceVariants && product.priceVariants[0].qty > 1));
    const initialMax = product.bundleBottleCount
      ? product.bundleBottleCount
      : (product.priceVariants ? product.priceVariants[0].qty : 1);
    initScentPicker(initialMax, isMulti);
  }

  /* features */
  const fl = document.getElementById('featuresList');
  fl.innerHTML = product.features.map(f =>
    `<div class="feature-item"><i class="ph-fill ${f.icon}"></i><span>${f.text}</span></div>`
  ).join('');

  /* add to cart */
  document.getElementById('atcBtn').addEventListener('click', handleAddToCart);

  /* upsells */
  renderUpsells();

  /* related */
  renderRelated();
}

function renderGallery() {
  const mainImg = document.getElementById('galleryMain');
  mainImg.src = product.img;
  mainImg.alt = product.name;

  const thumbs = document.getElementById('galleryThumbs');
  if (product.thumbs && product.thumbs.length > 1) {
    thumbs.innerHTML = product.thumbs.map((t, i) =>
      `<button class="gallery-thumb ${i===0?'active':''}" onclick="switchThumb('${t}',this)">
        <img src="${t}" alt="${product.name} תמונה ${i+1}" loading="lazy">
       </button>`
    ).join('');
  }
}

function switchThumb(src, el) {
  document.getElementById('galleryMain').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('galleryMain').src = src;
    document.getElementById('galleryMain').style.opacity = '1';
  }, 150);
  document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function renderPrice() {
  const block = document.getElementById('priceBlock');
  if (!product.priceVariants) {
    const saving = product.origPrice ? product.origPrice - product.price : 0;
    block.innerHTML = `
      <div class="price-block">
        <span class="price-now">₪${product.price.toLocaleString('he-IL')}</span>
        ${product.origPrice ? `<span class="price-was">₪${product.origPrice.toLocaleString('he-IL')}</span>` : ''}
      </div>
      ${saving > 0 ? `<div class="price-saving"><i class="ph-fill ph-tag"></i> חוסכים ₪${saving} עכשיו!</div>` : ''}
    `;
  } else {
    renderPrice_Variant();
  }
}

function renderPrice_Variant() {
  const v = product.priceVariants[selectedQtyIdx];
  document.getElementById('priceBlock').innerHTML = `
    <div class="price-block">
      <span class="price-now">₪${v.price.toLocaleString('he-IL')}</span>
      ${selectedQtyIdx > 0 ? `<span class="price-saving" style="font-size:.85rem">חסכון ₪${(product.priceVariants[0].price * v.qty - v.price).toLocaleString('he-IL')}</span>` : ''}
    </div>
  `;
}

function renderQtyVariants() {
  const list = document.getElementById('qtyVariantsList');
  list.innerHTML = product.priceVariants.map((v, i) => {
    const base = product.priceVariants[0].price;
    const save = base * v.qty - v.price;
    return `
    <label class="qty-variant ${i===0?'selected':''}">
      <input type="radio" name="qty" value="${i}" ${i===0?'checked':''}>
      <span class="qv-label">${v.label}</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end">
        <span class="qv-price">₪${v.price}</span>
        ${save > 0 ? `<span class="qv-save">חסכון ₪${save}</span>` : ''}
      </div>
    </label>`;
  }).join('');

  list.querySelectorAll('.qty-variant').forEach((el, i) => {
    el.addEventListener('click', () => {
      selectedQtyIdx = i;
      list.querySelectorAll('.qty-variant').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      renderPrice_Variant();
      // Reset scent picker when qty changes
      if (product.hasScent) {
        Object.keys(bundleScentCounts).forEach(k => delete bundleScentCounts[k]);
        bspClearState();
        const newMax = product.priceVariants[i].qty;
        initScentPicker(newMax, newMax > 1);
      }
    });
  });
}

function handleAddToCart() {
  // Validate scent selection
  if (product.hasScent) {
    const freeTotal = bspGetFreeTotal();
    if (pickerMulti && freeTotal < pickerMax) {
      // Multi mode: must fill all free slots (bundle)
      const picker = document.getElementById('scentPicker');
      picker.scrollIntoView({ behavior: 'smooth', block: 'center' });
      picker.classList.add('bsp-shake');
      setTimeout(() => picker.classList.remove('bsp-shake'), 600);
      cartToast(`נא לבחור ${pickerMax - freeTotal} ניחוחות נוספים (${freeTotal}/${pickerMax})`);
      return;
    }
    if (!pickerMulti && bspGetTotal() === 0) {
      // Single mode: must pick at least one
      const picker = document.getElementById('scentPicker');
      picker.scrollIntoView({ behavior: 'smooth', block: 'center' });
      picker.classList.add('bsp-shake');
      setTimeout(() => picker.classList.remove('bsp-shake'), 600);
      cartToast('נא לבחור ניחוח תחילה');
      return;
    }
    selectedScent = bspGetScentString();
  }

  let qty = 1;
  if (product.priceVariants) {
    qty = product.priceVariants[selectedQtyIdx].qty;
  }

  const scentSurcharge = product.hasScent ? bspGetSurcharge() : 0;
  cartAdd(prodId, { scent: selectedScent, qty, scentSurcharge });
  bspClearState(); // clear saved selection after adding to cart

  upsellsAdded.forEach(uid => {
    const counts = upsellScentMap[uid];
    const scent  = counts && Object.keys(counts).length
      ? Object.entries(counts).filter(([,c]) => c > 0).map(([n,c]) => c > 1 ? `${n} ×${c}` : n).join(', ')
      : (selectedScent || '');
    cartAddUpsell(uid, scent);
  });

  // Show cart transition overlay then redirect
  const _overlay = document.getElementById('cartTransitionOverlay');
  if (_overlay) _overlay.classList.add('show');
  setTimeout(() => { location.href = 'cart.html'; }, 950);
}

function renderUpsells() {
  const section = document.getElementById('upsellsSection');
  const list    = document.getElementById('upsellsList');

  if (!product.upsells || product.upsells.length === 0) {
    section.style.display = 'none';
    return;
  }

  const ids = [...new Set(product.upsells)];
  list.innerHTML = ids.map(uid => {
    const u = UPSELLS[uid];
    if (!u) return '';
    const save    = u.standAlonePrice - u.bundlePrice;
    const savePct = Math.round(save / u.standAlonePrice * 100);
    const uspMax  = u.qty || 1;
    const scentRow = u.hasScent ? `
      <div class="usp-wrap" onclick="event.stopPropagation()">
        <div class="usp-label">בחר ניחוח${uspMax > 1 ? ` (עד ${uspMax})` : ''}:</div>
        <div class="usp-chips" id="usp-chips-${uid}">
          ${SCENTS.map(s => `<button class="usp-chip" data-scent="${s.name}"
            onclick="event.stopPropagation();uspToggle('${uid}',this.dataset.scent,${uspMax})" type="button">${s.name}</button>`).join('')}
        </div>
      </div>` : '';

    return `
    <div class="upsell-card" id="upsell-${uid}" onclick="toggleUpsell('${uid}',this)">
      <div class="upsell-card__img">
        <img src="${u.img}" alt="${u.name}" loading="lazy">
      </div>
      <div class="upsell-card__info">
        <div class="upsell-card__note">עם ההזמנה — ${savePct}% הנחה</div>
        <div class="upsell-card__name">${u.name}</div>
        <div class="upsell-card__prices">
          <span class="up">₪${u.bundlePrice}</span>
          <span class="was">₪${u.standAlonePrice}</span>
          <span class="save">חסכון ₪${save}</span>
        </div>
        ${scentRow}
      </div>
      <button class="upsell-card__btn" aria-label="הוסף">
        <i class="ph ph-plus"></i>
      </button>
    </div>`;
  }).join('');
}

function toggleUpsell(uid, el) {
  // Ignore clicks inside the scent chip area (they stopPropagation already, but guard anyway)
  if (event.target.closest('.usp-wrap')) return;

  el.classList.toggle('added');
  const btn = el.querySelector('.upsell-card__btn i');

  if (el.classList.contains('added')) {
    upsellsAdded.add(uid);
    if (btn) btn.className = 'ph ph-check';
    cartToast(`"${UPSELLS[uid]?.name}" נוסף — יתווסף עם הלחיצה על הוסף לסל`);
  } else {
    upsellsAdded.delete(uid);
    if (btn) btn.className = 'ph ph-plus';
  }
}

/* ---- Compact upsell chip picker ---- */
function uspToggle(uid, name, max) {
  if (!upsellScentMap[uid]) upsellScentMap[uid] = {};
  const counts = upsellScentMap[uid];
  const total  = Object.values(counts).reduce((s, c) => s + c, 0);
  if (counts[name]) {
    counts[name]--;
    if (!counts[name]) delete counts[name];
  } else if (total < max) {
    counts[name] = 1;
  } else if (max === 1) {
    // Single mode: replace
    Object.keys(counts).forEach(k => delete counts[k]);
    counts[name] = 1;
  }
  // For max>1 and at cap: silently ignore (user must deselect first)
  uspRender(uid);
}

function uspRender(uid) {
  const counts = upsellScentMap[uid] || {};
  const container = document.getElementById(`usp-chips-${uid}`);
  if (!container) return;
  container.querySelectorAll('.usp-chip').forEach(chip => {
    chip.classList.toggle('usp-chip--active', !!(counts[chip.dataset.scent]));
  });
}

function renderRelated() {
  const related = Object.values(PRODUCTS)
    .filter(p => p.id !== prodId && p.category === product.category)
    .slice(0, 4);

  const extra = Object.values(PRODUCTS)
    .filter(p => p.id !== prodId && !related.find(r => r.id === p.id))
    .slice(0, 4 - related.length);

  const all = [...related, ...extra].slice(0, 4);
  const grid = document.getElementById('relatedGrid');

  grid.innerHTML = all.map(p => {
    const saving = p.origPrice ? `<span class="upsell-card__prices" style="display:inline;font-size:.78rem;font-weight:600;color:#16A34A">חסכון ₪${p.origPrice - p.price}</span>` : '';
    const orig   = p.origPrice ? `<span style="font-size:13px;color:var(--light);text-decoration:line-through;font-weight:400">₪${p.origPrice}</span>` : '';
    return `
    <a href="product.html?id=${p.id}" class="product-card">
      <div class="product-card__img-wrap">
        <img class="product-card__img" src="${p.img}" alt="${p.name}" loading="lazy">
        ${p.badge ? `<span class="product-card__badge product-card__badge--hot">${p.badge}</span>` : ''}
      </div>
      <div class="product-card__body">
        <div class="product-card__name">${p.name}</div>
        <div class="product-card__scent">${p.categoryLabel}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <span class="product-card__price">₪${p.price}</span>${orig}
        </div>
        <div class="product-card__cta">
          <span class="product-card__btn">צפייה במוצר</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

init();
</script>

  <div class="cto-card">
    <div class="cto-icon">
      <i class="ph-fill ph-shopping-cart-simple"></i>
    </div>
    <p class="cto-text">מעביר לסל הקניות...</p>
    <p class="cto-sub">המוצר נוסף בהצלחה</p>
  </div>
</div>
