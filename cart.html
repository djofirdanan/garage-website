<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>סל הקניות — GARAGE</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://garage-beryl-sigma.vercel.app/cart.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="siteHeader"></div>

<!-- CART PAGE -->
<main class="cart-page">
  <div class="container">
    <h1 class="cart-title">
      <i class="ph-fill ph-shopping-cart" style="color:var(--black);margin-left:12px"></i>
      סל הקניות
    </h1>

    <!-- EMPTY STATE -->
    <div class="cart-empty-state" id="cartEmpty" style="display:none">
      <i class="ph ph-shopping-cart-simple"></i>
      <h3>הסל ריק</h3>
      <p>עדיין לא הוספת מוצרים לסל</p>
      <a href="index.html#products" class="btn--primary" style="display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:99px;font-weight:700;margin-top:20px;font-size:15px">
        <i class="ph ph-arrow-right"></i>
        לחזור לקניות
      </a>
    </div>

    <!-- CART LAYOUT -->
    <div class="cart-layout" id="cartLayout">

      <!-- RIGHT: items + upsells -->
      <div class="cart-main-col">
        <div class="cart-items-list" id="cartItems"></div>

        <!-- CART UPSELLS -->
        <div class="cart-upsells" id="cartUpsells">
          <h3>
            <i class="ph-fill ph-lightning"></i>
            שכחת משהו? הוסף לפני המשלוח:
          </h3>
          <div class="upsells-list" id="cartUpsellsList"></div>
        </div>
      </div>

      <!-- LEFT: summary -->
      <div class="cart-summary-col">
        <div class="order-summary">
          <div class="order-summary__head">
            <h3><i class="ph ph-receipt" style="margin-left:8px"></i>סיכום הזמנה</h3>
          </div>
          <div class="order-summary__body">
            <div class="summary-row">
              <span>סכום ביניים</span>
              <span id="summarySubtotal">₪0</span>
            </div>
            <div class="summary-row" id="summaryShipRow">
              <span><i class="ph ph-truck" style="margin-left:4px"></i>משלוח</span>
              <span id="summaryShip">₪35</span>
            </div>
            <div class="shipping-note" id="freeShipNote" style="display:none">
              <i class="ph-fill ph-truck"></i>
              כל הכבוד — משלוח חינם!
            </div>
            <div class="shipping-note shipping-note--progress" id="freeShipProgress" style="display:none">
              <i class="ph ph-package"></i>
              <span id="freeShipProgressText"></span>
            </div>
            <div class="summary-row summary-row--saving" id="summarySaving" style="display:none">
              <span><i class="ph ph-tag" style="margin-left:4px"></i>חסכת בהזמנה</span>
              <span id="summarySavingAmt"></span>
            </div>
            <div class="summary-row summary-row--total">
              <span>סה"כ לתשלום</span>
              <strong id="summaryTotal">₪0</strong>
            </div>
          </div>
          <div class="summary-cta">
            <a href="checkout.html" class="btn-add btn-full btn-lg" id="checkoutBtn" style="justify-content:center;gap:10px;text-decoration:none">
              <i class="ph ph-credit-card"></i>
              לתשלום
            </a>
            <a href="index.html#products" class="summary-continue" id="continueShopping">
              <i class="ph ph-arrow-right" style="margin-left:4px"></i>
              המשך קניות
            </a>
          </div>
        </div>

        <!-- Bit teaser -->
        <div class="bit-teaser">
          <div class="bit-icon">bit</div>
          <span>תשלום מהיר דרך <strong>ביט</strong> — קל, מאובטח ומיידי.</span>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="site-components.js"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script>
function renderCart() {
  const items   = cartGet();
  const totals  = cartTotals();
  const isEmpty = items.length === 0;

  document.getElementById('cartEmpty').style.display  = isEmpty ? 'flex' : 'none';
  document.getElementById('cartLayout').style.display = isEmpty ? 'none' : 'grid';
  if (isEmpty) return;

  /* items */
  document.getElementById('cartItems').innerHTML = items.map(item => {
    const lineTotal = (item.price * item.qty).toLocaleString('he-IL');
    return `
    <div class="cart-item">
      <div class="cart-item__img">
        <img src="${item.img}" alt="${item.name}" loading="lazy">
      </div>
      <div class="cart-item__info">
        <div class="cart-item__name">${item.name}</div>
        ${item.scent ? `<div class="cart-item__scent"><i class="ph ph-drop" style="margin-left:4px;opacity:.6"></i>${item.scent}</div>` : ''}
        ${item.isUpsell ? `<div class="cart-item__upsell-tag"><i class="ph-fill ph-tag"></i> מחיר מיוחד</div>` : ''}
        <button class="cart-item__remove" onclick="removeItem('${item.uid}')">
          <i class="ph ph-trash"></i> הסר
        </button>
      </div>
      <div class="cart-item__right">
        <div class="cart-item__price">₪${lineTotal}</div>
        <div class="cart-item__qty">
          <button onclick="changeQty('${item.uid}',-1)"><i class="ph ph-minus"></i></button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${item.uid}',1)"><i class="ph ph-plus"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');

  /* summary */
  document.getElementById('summarySubtotal').textContent = `₪${totals.subtotal.toLocaleString('he-IL')}`;

  if (totals.shipping === 0) {
    document.getElementById('summaryShip').textContent         = 'חינם!';
    document.getElementById('summaryShipRow').style.color      = '#16A34A';
    document.getElementById('freeShipNote').style.display      = 'flex';
    document.getElementById('freeShipProgress').style.display  = 'none';
  } else {
    document.getElementById('summaryShip').textContent         = `₪${totals.shipping}`;
    document.getElementById('summaryShipRow').style.color      = '';
    document.getElementById('freeShipNote').style.display      = 'none';
    const needed = FREE_SHIP_THRESHOLD - totals.subtotal;
    if (needed > 0) {
      document.getElementById('freeShipProgress').style.display = 'flex';
      document.getElementById('freeShipProgressText').textContent = `עוד ₪${needed} למשלוח חינם!`;
    }
  }

  const totalSave = totals.savings + totals.saleSave;
  if (totalSave > 0) {
    document.getElementById('summarySaving').style.display    = 'flex';
    document.getElementById('summarySavingAmt').textContent   = `₪${totalSave.toLocaleString('he-IL')}`;
  }

  document.getElementById('summaryTotal').textContent = `₪${totals.total.toLocaleString('he-IL')}`;

  /* upsells */
  renderCartUpsells();
}

function renderCartUpsells() {
  const suggestions = getCartUpsells();
  const section     = document.getElementById('cartUpsells');
  const list        = document.getElementById('cartUpsellsList');

  if (suggestions.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  list.innerHTML = suggestions.map(uid => {
    const u = UPSELLS[uid];
    if (!u) return '';
    const save    = u.standAlonePrice - u.bundlePrice;
    const savePct = Math.round(save / u.standAlonePrice * 100);
    const scentRow = u.hasScent ? `
      <div class="upsell-scent" onclick="event.stopPropagation()">
        <select id="cu-scent-${uid}" class="scent-select" style="font-size:.78rem;padding:5px 8px;max-width:160px">
          <option value="">בחר ניחוח</option>
          ${SCENTS.map(s=>`<option value="${s.name}">${s.name}</option>`).join('')}
        </select>
      </div>` : '';
    return `
    <div class="upsell-card" onclick="quickAddUpsell('${uid}',this)">
      <div class="upsell-card__img">
        <img src="${u.img}" alt="${u.name}" loading="lazy">
      </div>
      <div class="upsell-card__info">
        <div class="upsell-card__note">הוסף עכשיו — ${savePct}% הנחה</div>
        <div class="upsell-card__name">${u.name}</div>
        <div class="upsell-card__prices">
          <span class="up">₪${u.bundlePrice}</span>
          <span class="was">₪${u.standAlonePrice}</span>
          <span class="save">חסכון ₪${save}</span>
        </div>
        ${scentRow}
      </div>
      <button class="upsell-card__btn" aria-label="הוסף"><i class="ph ph-plus"></i></button>
    </div>`;
  }).join('');
}

function quickAddUpsell(uid, el) {
  if (event.target.tagName === 'SELECT' || event.target.tagName === 'OPTION') return;
  const scent = document.getElementById(`cu-scent-${uid}`)?.value || '';
  cartAddUpsell(uid, scent);
  el.classList.add('added');
  el.querySelector('.upsell-card__btn i').className = 'ph ph-check';
  setTimeout(() => renderCart(), 400);
}

function removeItem(uid) {
  cartRemove(uid);
  renderCart();
}

function changeQty(uid, delta) {
  cartUpdateQty(uid, delta);
  renderCart();
}

/* Mobile nav */
const hamburger     = document.getElementById('navHamburger');
const mobileNav     = document.getElementById('mobileNav');
const mobileOverlay = document.getElementById('mobileNavOverlay');

function openMobileNav() {
  hamburger.classList.add('open');
  mobileNav.classList.add('open');
  mobileOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMobileNav() {
  hamburger.classList.remove('open');
  mobileNav.classList.remove('open');
  mobileOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
hamburger?.addEventListener('click', () => {
  mobileNav.classList.contains('open') ? closeMobileNav() : openMobileNav();
});

/* "המשך קניות" — return to last viewed product */
const lastProduct = sessionStorage.getItem('garage_last_product');
if (lastProduct) {
  const link = document.getElementById('continueShopping');
  if (link) link.href = lastProduct;
}

renderCart();
</script>
<script src="customer-auth.js"></script>
<script src="auth-modal.js"></script>
</body>
</html>
